# 20 — STRATEGY B: DP8 x EP + MegaMoE + DSpark (one 8x B200 machine)
# The throughput shape, straight from the model card's reference config
# (published as DP4 on 4x GB300 — widened here to the full 8x B200).
# deep_gemm_mega_moe is the expert-routing engine built for the NVLink domain,
# which is exactly where all our expert traffic lives.
# DSpark is one flag: the draft weights ship inside the same checkpoint.
#
#   kubectl -n v4-flash-demo delete rayjob serve-tep8
#   kubectl apply -f 20-strategy-dp8-ep.yaml
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: serve-dp8-ep
  namespace: v4-flash-demo
spec:
  clusterSelector:
    ray.io/cluster: v4-flash
  # HTTPMode: the operator submits over the head dashboard, so there is no
  # submitter pod — which matters because this image has no ray to submit with.
  submissionMode: HTTPMode
  entrypoint: >-
    vllm serve /models/DeepSeek-V4-Flash-0731
    --served-model-name deepseek-ai/DeepSeek-V4-Flash-0731
    --distributed-executor-backend ray
    --data-parallel-size 8
    --data-parallel-backend ray
    --enable-expert-parallel
    --moe-backend deep_gemm_mega_moe
    --trust-remote-code
    --kv-cache-dtype fp8
    --block-size 256
    --attention-config '{"use_fp4_indexer_cache":true}'
    --speculative-config '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"greedy"}'
    --tokenizer-mode deepseek_v4
    --tool-call-parser deepseek_v4
    --enable-auto-tool-choice
    --reasoning-parser deepseek_v4
    --max-model-len 262144
    --host 0.0.0.0 --port 8000
---
# HOW TO RUN + MEASURE THIS STRATEGY
#
# One command — tears down the previous strategy first (measuring one at a time is what
# makes the columns comparable; 24 GPUs do allow C+D together, see `just stage-up`),
# applies this one, waits for the engine, measures, and leaves it serving:
#
#   just run-b
#
# Or by hand:
#   kubectl -n v4-flash-demo delete rayjob serve-tep8
#   kubectl apply -f 20-strategy-dp8-ep.yaml
#   just bench-b                 # writes metrics/B-dp8-ep.json
#   just compare
#
# What the numbers should show: the highest aggregate tok/s at concurrency 32,
# with single-stream latency worse than strategy A — the cost of all-to-all
# expert routing, paid back in throughput.
