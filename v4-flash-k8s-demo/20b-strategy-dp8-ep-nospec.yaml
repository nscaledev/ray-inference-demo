# 20b — STRATEGY B WITHOUT DSPARK: identical to 20- with one flag removed.
#
# This exists to isolate the speculator's cost, which is the only honest way to claim one.
# Keep it: the first attempt at that claim (4.4x) came from a harness that counted SSE
# chunks instead of tokens, which penalised the one config using speculative decoding —
# vLLM emits one chunk per engine step and a step can carry several accepted tokens.
#
#   kubectl apply -f 20b-strategy-dp8-ep-nospec.yaml
#   just bench-b-nospec
# (published as DP4 on 4x GB300 — widened here to the full 8x B200).
#
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: serve-dp8-ep-nospec
  namespace: v4-flash-demo
spec:
  clusterSelector:
    ray.io/cluster: v4-flash
  # HTTPMode: the operator submits over the head dashboard, so there is no
  # submitter pod — which matters because this image has no ray to submit with.
  submissionMode: HTTPMode
  entrypoint: >-
    vllm serve /models/DeepSeek-V4-Flash-0731
    --served-model-name deepseek-ai/DeepSeek-V4-Flash-0731
    --distributed-executor-backend ray
    --data-parallel-size 8
    --data-parallel-backend ray
    --enable-expert-parallel
    --moe-backend deep_gemm_mega_moe
    --trust-remote-code
    --kv-cache-dtype fp8
    --block-size 256
    --attention-config '{"use_fp4_indexer_cache":true}'
    --tokenizer-mode deepseek_v4
    --tool-call-parser deepseek_v4
    --enable-auto-tool-choice
    --reasoning-parser deepseek_v4
    --max-model-len 262144
    --host 0.0.0.0 --port 8000
---
# HOW TO RUN + MEASURE
#   just teardown && kubectl apply -f 20b-strategy-dp8-ep-nospec.yaml && just bench-b-nospec
